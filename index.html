<!DOCTYPE html>
<html>
<head>
<title>HedgeOS</title>

<script src="https://js.puter.com/v2/"></script>

<style>

*{
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    margin:0;
    overflow:hidden;
    background:#111;
}


/* DESKTOP */

#desktop{
    width:100vw;
    height:100vh;
    background:
    linear-gradient(135deg,#111827,#2563eb);
    position:relative;
}


/* ICONS */

.icon{
    width:90px;
    text-align:center;
    color:white;
    margin:20px;
    cursor:pointer;
}

.icon div{
    font-size:45px;
}


/* TASKBAR */

#taskbar{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:45px;
    background:#111827dd;
    display:flex;
    align-items:center;
}


#start{
    background:#2563eb;
    color:white;
    padding:10px 20px;
    cursor:pointer;
}


#clock{
    margin-left:auto;
    color:white;
    margin-right:20px;
}



/* START MENU */

#menu{

display:none;
position:absolute;
bottom:45px;
left:0;
width:250px;
background:#1f2937;
color:white;
padding:20px;
border-radius:10px;

}



.menuitem{
padding:10px;
cursor:pointer;
}

.menuitem:hover{
background:#374151;
}


/* WINDOWS */

.window{

position:absolute;
background:white;
width:500px;
height:350px;
top:100px;
left:200px;
border-radius:12px;
box-shadow:0 0 20px black;
overflow:hidden;

}


.title{

height:35px;
background:#2563eb;
color:white;
padding:8px;
cursor:move;

}


.content{

padding:15px;
height:calc(100% - 35px);
overflow:auto;

}



button{

padding:8px;
border:none;
background:#2563eb;
color:white;
border-radius:5px;
cursor:pointer;

}


.file{

padding:8px;
border-bottom:1px solid #ddd;

}


</style>

</head>


<body>


<div id="desktop">


<div class="icon" onclick="openFiles()">
<div>📁</div>
Files
</div>


<div class="icon" onclick="openAbout()">
<div>💻</div>
About
</div>



<div id="menu">

<h2>HedgeOS</h2>

<div class="menuitem" onclick="openFiles()">
📁 File Manager
</div>


<div class="menuitem" onclick="openTerminal()">
⌨ Terminal
</div>


<div class="menuitem">
⚙ Settings
</div>


</div>



<div id="taskbar">

<div id="start" onclick="toggleMenu()">
🌿 Hedge
</div>

<div id="clock"></div>

</div>


</div>




<script>


let windows=[];



function toggleMenu(){

let m=document.getElementById("menu");

m.style.display=
m.style.display=="block"
?"none":"block";

}



function createWindow(title,html){


let win=document.createElement("div");

win.className="window";


win.innerHTML=`

<div class="title">
${title}
</div>

<div class="content">
${html}
</div>

`;



document.getElementById("desktop")
.appendChild(win);



dragWindow(win);


windows.push(win);


return win;

}





function dragWindow(win){

let bar=win.querySelector(".title");

let offsetX,offsetY;


bar.onmousedown=e=>{

offsetX=e.clientX-win.offsetLeft;
offsetY=e.clientY-win.offsetTop;


document.onmousemove=e=>{

win.style.left=
e.clientX-offsetX+"px";

win.style.top=
e.clientY-offsetY+"px";

};


document.onmouseup=()=>{

document.onmousemove=null;

};

};


}





async function openFiles(){


let html=`

<h2>Hedge File Manager</h2>


<button onclick="uploadFile()">
Upload File
</button>

<br><br>


<div id="files">
Loading files...
</div>


`;


let win=createWindow(
"📁 Files",
html
);



loadFiles(win);


}




async function loadFiles(win){

let box=win.querySelector("#files");


try{


let files=
await puter.fs.readdir("/");



box.innerHTML="";


files.forEach(file=>{


let div=document.createElement("div");

div.className="file";


div.innerHTML=
"📄 "+file.name;


div.onclick=()=>{

launchFile(file);

};


box.appendChild(div);


});


}catch(e){

box.innerHTML=
"Not connected to Puter yet.";

}


}




async function uploadFile(){

let file=
await puter.ui.openFilePicker();


await puter.fs.write(
"/"+file.name,
file
);


alert("Uploaded!");

}




function launchFile(file){


let name=file.name.toLowerCase();


if(name.endsWith(".exe")){


createWindow(
"EXE Runner",
`

<h2>Windows Program</h2>

<p>
Detected:
${file.name}
</p>

<p>
EXE emulation will be added using WebAssembly Wine/DOSBox.
</p>

`
);


}



else if(name.endsWith(".apk")){


createWindow(
"APK Runner",

`

<h2>Android App</h2>

<p>
Detected:
${file.name}
</p>


<p>
Android emulator layer coming soon.
</p>

`

);



}



else{


createWindow(
file.name,

`
Opened:
${file.name}
`

);


}


}





function openAbout(){

createWindow(
"About HedgeOS",

`

<h1>🌿 HedgeOS</h1>

<p>
A web-based operating system powered by Puter.js.
</p>

<p>
Version 0.1 Prototype
</p>

`

);


}




function openTerminal(){

createWindow(

"Hedge Terminal",

`

<input id="cmd"
placeholder="Type command..."
style="width:100%;padding:10px">


<p id="output"></p>


`

);


}




setInterval(()=>{

document.getElementById("clock")
.innerHTML=
new Date().toLocaleTimeString();


},1000);



</script>


</body>
</html>
